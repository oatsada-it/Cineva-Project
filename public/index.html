<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบสมาชิก VIP - Cineva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen flex flex-col justify-between">

    <!-- Navbar ด้านบนสุด -->
    <nav class="border-b border-gray-800 bg-[#121824]/50 backdrop-blur px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-indigo-500 text-2xl font-bold">▶</span>
            <span class="text-lg font-bold tracking-wider">Cineva <span class="text-indigo-400 font-light text-xs border border-indigo-500/30 px-2 py-0.5 rounded-full bg-indigo-500/10">VIP Streaming</span></span>
        </div>
    </nav>

    <!-- กล่องกรอก Key ตรงกลาง (หน้าแรกสุด) -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-[#121824] border border-gray-800 p-8 rounded-2xl w-full max-w-md shadow-2xl relative">
            <div class="absolute -top-10 left-1/2 transform -translate-x-1/2 bg-[#0b0f19] border border-gray-800 w-20 h-20 rounded-2xl flex items-center justify-center shadow-xl">
                <span class="text-3xl">🔑</span>
            </div>
            
            <div class="text-center mt-6 mb-6">
                <h1 class="text-xl font-bold text-white mb-1">กรอก Key VIP เพื่อเข้าชม</h1>
                <p class="text-xs text-gray-400">ใส่รหัสผ่านที่ได้รับจากแอดมินเพื่อปลดล็อกระบบ</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1.5">รหัส Key VIP</label>
                    <input type="text" id="keyInput" placeholder="VIP-XXX-XXX-XXX" required
                        class="w-full bg-gray-900 border border-gray-800 text-white px-4 py-3 rounded-xl text-sm focus:outline-none focus:border-indigo-500 tracking-wider text-center font-mono uppercase">
                </div>

                <div id="errorMessage" class="text-red-400 text-xs text-center hidden"></div>

                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl text-sm font-medium transition shadow-lg shadow-indigo-600/30">
                    ยืนยันรหัสเข้าสู่ระบบ
                </button>
            </form>
        </div>
    </main>

    <!-- Footer เล็กๆ -->
    <footer class="text-center py-6 text-xs text-gray-600 border-t border-gray-900">
        © Cineva MVP. All rights reserved.
    </footer>

    <script>
        // ส่งรหัส Key ไปเช็กกับ Server
        async function handleLogin(event) {
            event.preventDefault();
            const key = document.getElementById('keyInput').value.trim();
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');

            errorDiv.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerText = 'กำลังตรวจสอบ...';

            try {
                const response = await fetch('/api/member/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: key })
                });

                const data = await response.json();

                if (response.ok && data.ok) {
                    // ถ้าถูกต้อง พาไปหน้าเลือกหนัง (menu.html)
                    window.location.href = '/menu.html';
                } else {
                    errorDiv.innerText = data.message || 'รหัส Key ไม่ถูกต้อง หรือหมดอายุ';
                    errorDiv.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'ยืนยันรหัสเข้าสู่ระบบ';
                }
            } catch (err) {
                errorDiv.innerText = 'เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์';
                errorDiv.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerText = 'ยืนยันรหัสเข้าสู่ระบบ';
            }
        }

        // ถ้าระบบเคยล็อกอินไว้แล้ว ข้ามมาหน้าเมนูเลย
        async function checkAlreadyLoggedIn() {
            try {
                const res = await fetch('/api/member/verify');
                const data = await res.json();
                if (data.ok) {
                    window.location.href = '/menu.html';
                }
            } catch (err) {}
        }

        checkAlreadyLoggedIn();
    </script>
</body>
</html>

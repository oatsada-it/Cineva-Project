<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Cineva MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-[#121824] border-r border-gray-800 flex flex-col justify-between hidden md:flex">
        <div>
            <!-- Logo -->
            <div class="flex items-center space-x-2 px-6 py-6 border-b border-gray-800">
                <span class="text-indigo-500 text-2xl font-bold">▶</span>
                <span class="text-lg font-bold tracking-wide">Cineva <span class="text-indigo-500">MVP</span></span>
            </div>
            <!-- Menu items -->
            <div class="px-4 py-4 space-y-1 text-sm text-gray-400">
                <a href="/admin" class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-indigo-600 text-white font-medium">
                    <span>📊</span><span>แดชบอร์ด</span>
                </a>
                <a href="#create" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-gray-800 hover:text-white transition">
                    <span>🔑</span><span>จัดการ KEY</span>
                </a>
                <a href="#stats" class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-gray-800 hover:text-white transition">
                    <span>👥</span><span>ผู้ใช้งานทั้งหมด</span>
                </a>
            </div>
        </div>
        <!-- Logout -->
        <div class="p-4 border-t border-gray-800">
            <button onclick="adminLogout()" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl bg-red-500/10 text-red-400 hover:bg-red-500/20 transition text-sm">
                <span>🚪</span><span>ออกจากระบบ</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0">
        <!-- Top header -->
        <header class="flex items-center justify-between px-8 py-5 border-b border-gray-800 bg-[#0b0f19]/80 backdrop-blur-md">
            <h1 class="text-lg font-bold">แดชบอร์ดจัดการระบบ</h1>
            <div class="flex items-center space-x-3 text-sm text-gray-400">
                <span>admin</span>
                <div class="w-8 h-8 rounded-full bg-indigo-600/20 border border-indigo-500 flex items-center justify-center text-indigo-400">👤</div>
            </div>
        </header>

        <!-- Content body -->
        <div class="p-8 space-y-8 overflow-y-auto">
            <!-- 4 Stats Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-[#121824] border border-gray-800 p-6 rounded-2xl flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-400 mb-1">KEY ทั้งหมด</p>
                        <h3 id="statTotal" class="text-2xl font-bold">0</h3>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-indigo-600/10 text-indigo-400 flex items-center justify-center text-xl">🔑</div>
                </div>
                <div class="bg-[#121824] border border-gray-800 p-6 rounded-2xl flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-400 mb-1">ผู้ใช้งานวันนี้</p>
                        <h3 class="text-2xl font-bold text-indigo-400">28</h3>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-blue-600/10 text-blue-400 flex items-center justify-center text-xl">👥</div>
                </div>
                <div class="bg-[#121824] border border-gray-800 p-6 rounded-2xl flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-400 mb-1">ใช้ไปแล้ว</p>
                        <h3 id="statActive" class="text-2xl font-bold text-green-400">0</h3>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-green-600/10 text-green-400 flex items-center justify-center text-xl">⏰</div>
                </div>
                <div class="bg-[#121824] border border-gray-800 p-6 rounded-2xl flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-400 mb-1">คงเหลือ / หมดอายุ</p>
                        <h3 id="statExpired" class="text-2xl font-bold text-red-400">0</h3>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-red-600/10 text-red-400 flex items-center justify-center text-xl">🚫</div>
                </div>
            </div>

            <!-- Create Key & Table Section -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Create Form -->
                <div class="bg-[#121824] border border-gray-800 p-6 rounded-2xl h-fit">
                    <h2 class="text-base font-bold mb-4">สร้าง KEY ใหม่</h2>
                    <form id="createKeyForm" class="space-y-4">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">ระยะเวลาใช้งาน</label>
                            <select id="keyDays" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                                <option value="1">1 วัน</option>
                                <option value="7">7 วัน</option>
                                <option value="30">30 วัน</option>
                                <option value="90">90 วัน</option>
                                <option value="365">1 ปี</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">จำนวน</label>
                            <input type="number" id="keyCount" value="1" min="1" max="50" class="w-full bg-[#0b0f19] border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition text-sm shadow-lg shadow-indigo-600/20">
                            สร้าง KEY
                        </button>
                    </form>
                </div>

                <!-- Table Keys -->
                <div class="lg:col-span-2 bg-[#121824] border border-gray-800 p-6 rounded-2xl">
                    <h2 class="text-base font-bold mb-4">รายการ KEY ล่าสุด</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead>
                                <tr class="border-b border-gray-800 text-gray-400 text-xs">
                                    <th class="pb-3 font-medium">KEY</th>
                                    <th class="pb-3 font-medium">วันหมดอายุ</th>
                                    <th class="pb-3 font-medium">สถานะ</th>
                                    <th class="pb-3 font-medium text-right">การจัดการ</th>
                                </tr>
                            </thead>
                            <tbody id="keyTableBody" class="divide-y divide-gray-800/60 text-xs">
                                <!-- Data rows injected via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function loadAdminData() {
            const res = await fetch('/api/admin/keys');
            const data = await res.json();
            if(data.ok) {
                document.getElementById('statTotal').innerText = data.keys.length;
                const tbody = document.getElementById('keyTableBody');
                tbody.innerHTML = '';
                data.keys.forEach(k => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-800/30">
                            <td class="py-3 font-mono text-indigo-400">${k.key}</td>
                            <td class="py-3 text-gray-400">${new Date(k.expires_at).toLocaleDateString()}</td>
                            <td class="py-3"><span class="px-2 py-1 rounded-md text-[10px] ${k.active ? 'bg-green-500/10 text-green-400' : 'bg-red-500/10 text-red-400'}">${k.active ? 'ใช้งานได้' : 'หมดอายุ'}</span></td>
                            <td class="py-3 text-right">
                                <button onclick="deleteKey(${k.id})" class="text-red-400 hover:underline">ลบ</button>
                            </td>
                        </tr>
                    `;
                });
            }
        }

        document.getElementById('createKeyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const days = document.getElementById('keyDays').value;
            const res = await fetch('/api/admin/keys', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ days: Number(days) })
            });
            const data = await res.json();
            if(data.ok) {
                loadAdminData();
                alert('สร้าง Key สำเร็จ: ' + data.key);
            }
        });

        async function deleteKey(id) {
            if(confirm('ต้องการลบ Key นี้ใช่ไหม?')) {
                await fetch(`/api/admin/keys/${id}`, { method: 'DELETE' });
                loadAdminData();
            }
        }

        function adminLogout() {
            fetch('/api/admin/logout', { method: 'POST' }).then(() => {
                window.location.href = '/member';
            });
        }

        loadAdminData();
    </script>
</body>
</html>

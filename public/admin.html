<!doctype html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Control</title><link rel="stylesheet" href="/admin.css"></head>
<body>
<div id="loginPage" class="login-page"><div class="login-box">
  <div class="admin-logo">Do ซีรี่ย์</div><h1>System Control</h1><div class="sub">AUTHORIZED ONLY</div>
  <input id="username" placeholder="Username"><input id="password" type="password" placeholder="Password">
  <button onclick="login()">AUTHENTICATE</button><div id="loginMsg"></div>
</div></div>

<div id="app" class="app hidden">
<header class="top"><div class="brand">Do ซีรี่ย์ <span>ADMIN</span></div><button onclick="logout()">ออกจากระบบ</button></header>
<aside class="side">
  <div class="side-title">CONTROL PANEL</div>
  <a class="active">🔑 จัดการ Key</a>
  <a onclick="loadKeys()">↻ รีเฟรช</a>
</aside>
<main class="main">
  <div class="title-row"><div><h2>Key Management</h2><p>สร้าง ตรวจสอบ เพิ่มเวลา ลดเวลา เปิด/ปิด และลบ Key</p></div>
  <button class="primary" onclick="openCreate()">+ CREATE KEY</button></div>

  <div class="stats">
    <div><span>KEY ทั้งหมด</span><b id="sTotal">0</b></div>
    <div><span>ใช้งานได้</span><b id="sActive">0</b></div>
    <div><span>หมดอายุ</span><b id="sExpired">0</b></div>
  </div>

  <div class="toolbar"><input id="search" placeholder="ค้นหา Key..." oninput="render()"><button onclick="loadKeys()">รีเฟรชข้อมูล</button></div>
  <div class="table-wrap"><table><thead><tr><th>KEY</th><th>สร้างเมื่อ</th><th>หมดอายุ</th><th>สถานะ</th><th>การจัดการ</th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
</div>

<div id="modal" class="modal hidden"><div class="modal-box"><button class="x" onclick="closeCreate()">×</button><h2>สร้าง Key ใหม่</h2><p>กำหนดอายุ Key ที่ต้องการ</p><input id="days" type="number" min="1" max="3650" value="30"><span>วัน</span><button class="primary full" onclick="createKey()">CREATE KEY</button></div></div>

<script>
let data=[];
const $=id=>document.getElementById(id);
async function login(){
 const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("username").value,password:$("password").value})});
 const d=await r.json(); if(!r.ok){$("loginMsg").textContent=d.message;return;}
 $("loginPage").classList.add("hidden");$("app").classList.remove("hidden");loadKeys();
}
async function loadKeys(){
 const r=await fetch("/api/admin/keys"); if(r.status===401){$("loginPage").classList.remove("hidden");$("app").classList.add("hidden");return;}
 data=(await r.json()).keys; render(); loadStats();
}
async function loadStats(){const r=await fetch("/api/admin/stats");if(!r.ok)return;const d=await r.json();$("sTotal").textContent=d.total;$("sActive").textContent=d.active;$("sExpired").textContent=d.expired;}
function render(){
 const q=$("search").value.toLowerCase();
 const now=Date.now();
 $("rows").innerHTML=data.filter(x=>x.key.toLowerCase().includes(q)).map(x=>{
  const expired=new Date(x.expires_at).getTime()<=now;
  const status=!x.active?"ปิดใช้งาน":expired?"หมดอายุ":"ใช้งานได้";
  return `<tr><td><code>${x.key}</code><button class="copy" onclick="copyKey('${x.key}')">COPY</button></td>
  <td>${fmt(x.created_at)}</td><td>${fmt(x.expires_at)}</td>
  <td><span class="status ${x.active&&!expired?"ok":""}">${status}</span></td>
  <td class="actions">
  <button onclick="checkKey(${x.id})">ตรวจสอบ</button>
  <button onclick="changeTime(${x.id},1)">+1 วัน</button>
  <button onclick="changeTime(${x.id},7)">+7 วัน</button>
  <button onclick="changeTime(${x.id},-1)">-1 วัน</button>
  <button onclick="changeTime(${x.id},-7)">-7 วัน</button>
  <button onclick="toggle(${x.id})">${x.active?"ปิด":"เปิด"}</button>
  <button class="danger" onclick="removeKey(${x.id})">ลบ</button></td></tr>`;
 }).join("");
}
function fmt(v){return new Date(v).toLocaleString("th-TH")}
function copyKey(k){navigator.clipboard.writeText(k);alert("คัดลอก "+k+" แล้ว")}
async function checkKey(id){const r=await fetch("/api/admin/keys/"+id);const d=await r.json();if(!r.ok)return alert(d.message);const x=d.key;alert(`KEY: ${x.key}\\nสถานะ: ${x.active?"เปิดใช้งาน":"ปิดใช้งาน"}\\nหมดอายุ: ${fmt(x.expires_at)}\\nเคยใช้งานครั้งแรก: ${x.first_used_at?fmt(x.first_used_at):"ยังไม่เคยใช้"}`)}
async function changeTime(id,days){const action=days>0?"เพิ่ม":"ลด";if(!confirm(`${action}เวลา ${Math.abs(days)} วัน?`))return;const r=await fetch("/api/admin/keys/"+id+"/time",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({days})});const d=await r.json();if(!r.ok)return alert(d.message);loadKeys()}
async function toggle(id){await fetch("/api/admin/keys/"+id+"/toggle",{method:"POST"});loadKeys()}
async function removeKey(id){if(!confirm("ลบ Key นี้ถาวร?"))return;await fetch("/api/admin/keys/"+id,{method:"DELETE"});loadKeys()}
function openCreate(){$("modal").classList.remove("hidden")}
function closeCreate(){$("modal").classList.add("hidden")}
async function createKey(){const r=await fetch("/api/admin/keys",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({days:Number($("days").value)})});const d=await r.json();if(!r.ok)return alert(d.message);closeCreate();await loadKeys();alert("สร้าง Key สำเร็จ:\\n\\n"+d.key+"\\n\\nหมดอายุ: "+fmt(d.expiresAt));}
async function logout(){await fetch("/api/admin/logout",{method:"POST"});location.reload()}
</script></body></html>

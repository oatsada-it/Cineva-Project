<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังหนัง VIP - Cineva MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen flex flex-col justify-between">
    <!-- Navbar -->
    <nav class="flex items-center justify-between px-8 py-5 border-b border-gray-800/60 bg-[#0b0f19]/80 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <span class="text-indigo-500 text-2xl font-bold">▶</span>
            <span class="text-xl font-bold tracking-wide">Cineva <span class="text-indigo-500">VIP Streaming</span></span>
        </div>
        <div class="flex items-center space-x-4">
            <span id="keyDisplay" class="text-xs text-indigo-400 bg-indigo-500/10 border border-indigo-500/30 px-3 py-1.5 rounded-lg font-mono"></span>
            <button onclick="logout()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 text-xs px-4 py-2 rounded-lg transition">
                ออกจากระบบ
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-8">
        <div class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold mb-2">ยินดีต้อนรับสู่โซน VIP 🎉</h1>
                <p class="text-gray-400 text-sm">เลือกหนังหรือค้นหาด้วย ID ที่คุณต้องการรับชมได้เลย</p>
            </div>
            
            <!-- ช่องค้นหาด้วย ID หนัง -->
            <div class="flex items-center space-x-2">
                <input type="text" id="searchInput" placeholder="กรอก ID หนัง (เช่น 1, 9713)..." class="bg-gray-900 border border-gray-700 text-white px-4 py-2 rounded-xl text-sm focus:outline-none focus:border-indigo-500 w-64">
                <button onclick="searchMovie()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-xl text-sm font-medium transition">ค้นหา</button>
            </div>
        </div>

        <!-- Video Player -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden mb-12 shadow-2xl">
            <div class="aspect-video bg-black relative">
                <video id="videoPlayer" class="w-full h-full object-contain" controls>
                    เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
                </video>
            </div>
        </div>

        <!-- Movie Grid -->
        <h2 class="text-lg font-bold mb-6">ภาพยนตร์และซีรี่ย์ทั้งหมด</h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-6">
            <div onclick="location.href='watch.html?id=1'" class="bg-[#121824] border border-gray-800 rounded-xl overflow-hidden group cursor-pointer hover:border-indigo-500/50 transition">
                <div class="h-56 bg-gray-800 flex items-center justify-center text-gray-500 font-medium group-hover:scale-105 transition duration-300">Big Buck Bunny</div>
                <div class="p-4">
                    <h3 class="text-sm font-bold truncate">ID: 1 - ตัวอย่าง</h3>
                    <p class="text-xs text-gray-500 mt-1">Animation</p>
                </div>
            </div>
            <div onclick="location.href='watch.html?id=9713'" class="bg-[#121824] border border-gray-800 rounded-xl overflow-hidden group cursor-pointer hover:border-indigo-500/50 transition">
                <div class="h-56 bg-gray-800 flex items-center justify-center text-gray-500 font-medium group-hover:scale-105 transition duration-300">จ้าวสายฟ้า SSS</div>
                <div class="p-4">
                    <h3 class="text-sm font-bold truncate">ID: 9713 - จ้าวสายฟ้า</h3>
                    <p class="text-xs text-gray-500 mt-1">พากย์ไทย / Action</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-gray-500 border-t border-gray-800/40">
        Cineva MVP • ดูหนัง ดูซีรี่ย์ ไม่มีสะดุด
    </footer>

    <!-- Scripts -->
    <script>
        async function checkAuth() {
            try {
                const res = await fetch('/api/member/verify');
                const data = await res.json();
                if(!data.ok) {
                    window.location.href = '/member'; 
                } else {
                    document.getElementById('keyDisplay').innerText = 'KEY: ' + data.key;
                }
            } catch (err) {
                window.location.href = '/member';
            }
        }

        async function logout() {
            await fetch('/api/member/logout', { method: 'POST' });
            window.location.href = '/member';
        }

        checkAuth();

        // ฐานข้อมูลหนัง (ใส่ ID และลิงก์วิดีโอตรงนี้)
        const movieDatabase = {
            "1": "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
            "2": "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
            "9713": "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"
        };

        // ฟังก์ชันค้นหาหนังจากช่อง input
        function searchMovie() {
            const query = document.getElementById('searchInput').value.trim();
            if (movieDatabase[query]) {
                window.location.href = `watch.html?id=${query}`;
            } else {
                alert("ไม่พบ ID หนังนี้ในระบบ กรุณาลองใหม่อีกครั้ง");
            }
        }

        // โหลดลิงก์วิดีโอตาม ID จาก URL อัตโนมัติ
        document.addEventListener("DOMContentLoaded", function () {
            const urlParams = new URLSearchParams(window.location.search);
            const movieId = urlParams.get('id');
            const videoPlayer = document.getElementById('videoPlayer');

            if (movieId && movieDatabase[movieId]) {
                videoPlayer.src = movieDatabase[movieId];
                videoPlayer.load();
                videoPlayer.play().catch(error => {
                    console.log("Autoplay ถูกบล็อกโดยเบราว์เซอร์:", error);
                });
                document.getElementById('searchInput').value = movieId;
            }
        });
    </script>
</body>
</html>

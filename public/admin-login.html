<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบแอดมิน - Cineva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen flex flex-col justify-between">

    <nav class="border-b border-gray-800 bg-[#121824]/50 backdrop-blur px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-indigo-500 text-2xl font-bold">▶</span>
            <span class="text-lg font-bold tracking-wider">Cineva <span class="text-red-400 font-light text-xs border border-red-500/30 px-2 py-0.5 rounded-full bg-red-500/10">Admin Portal</span></span>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-[#121824] border border-gray-800 p-8 rounded-2xl w-full max-w-md shadow-2xl relative">
            <div class="absolute -top-10 left-1/2 transform -translate-x-1/2 bg-[#0b0f19] border border-gray-800 w-20 h-20 rounded-2xl flex items-center justify-center shadow-xl">
                <span class="text-3xl">🛡️</span>
            </div>
            
            <div class="text-center mt-6 mb-6">
                <h1 class="text-xl font-bold text-white mb-1">เข้าสู่ระบบผู้ดูแลระบบ</h1>
                <p class="text-xs text-gray-400">กรุณากรอกรหัสผ่านหลังบ้านเพื่อจัดการระบบ</p>
            </div>

            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1.5">รหัสผ่านแอดมิน (Admin Password)</label>
                    <input type="password" id="adminPassword" placeholder="••••••••" required
                        class="w-full bg-gray-900 border border-gray-800 text-white px-4 py-3 rounded-xl text-sm focus:outline-none focus:border-red-500 tracking-wider text-center font-mono">
                </div>

                <div id="errorMessage" class="text-red-400 text-xs text-center hidden"></div>

                <button type="submit" id="submitBtn" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-xl text-sm font-medium transition shadow-lg shadow-red-600/30">
                    เข้าสู่หลังบ้าน
                </button>
            </form>
        </div>
    </main>

    <footer class="text-center py-6 text-xs text-gray-600 border-t border-gray-900">
        © Cineva Admin. All rights reserved.
    </footer>

    <script>
        async function handleAdminLogin(event) {
            event.preventDefault();
            const password = document.getElementById('adminPassword').value;
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');

            errorDiv.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerText = 'กำลังตรวจสอบ...';

            try {
                // เปลี่ยน Endpoint นี้ให้ตรงกับ Route เช็ครหัสแอดมินใน Backend ของคุณ
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: password })
                });

                const data = await response.json();

                if (response.ok && data.ok) {
                    window.location.href = '/admin'; // เข้าหน้าจัดการหลังบ้าน
                } else {
                    errorDiv.innerText = data.message || 'รหัสผ่านแอดมินไม่ถูกต้อง';
                    errorDiv.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'เข้าสู่หลังบ้าน';
                }
            } catch (err) {
                errorDiv.innerText = 'เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์';
                errorDiv.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerText = 'เข้าสู่หลังบ้าน';
            }
        }
    </script>
</body>
</html>

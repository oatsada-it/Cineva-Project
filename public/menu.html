<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cineva MVP - หน้าหลัก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen">

    <!-- Navbar -->
    <nav class="border-b border-gray-800 bg-[#121824]/50 backdrop-blur sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-indigo-500 text-2xl font-bold">▶</span>
            <span class="text-lg font-bold tracking-wider">Cineva <span class="text-indigo-400 font-light text-xs border border-indigo-500/30 px-2 py-0.5 rounded-full bg-indigo-500/10">MVP</span></span>
        </div>
        
        <!-- ช่องค้นหาหนังบน Navbar -->
        <div class="hidden md:flex items-center gap-2">
            <input type="text" id="searchBox" placeholder="ค้นหาซีรีส์ หรือพิมพ์ชื่อเรื่อง..." class="bg-gray-900 border border-gray-800 text-white px-4 py-1.5 rounded-xl text-xs focus:outline-none focus:border-indigo-500 w-64">
            <button onclick="searchSeries()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-xl text-xs font-medium transition">ค้นหา</button>
        </div>

        <div class="flex items-center space-x-4">
            <button onclick="handleLogout()" class="border border-red-500/30 hover:bg-red-500/10 text-red-400 text-xs px-4 py-2 rounded-xl transition font-medium">ออกจากระบบ</button>
        </div>
    </nav>

    <!-- Main Hero & Catalog Section -->
    <main class="max-w-6xl mx-auto px-4 py-12">
        <div class="text-center py-8 flex flex-col items-center">
            <h1 class="text-4xl md:text-6xl font-extrabold text-white tracking-tight mb-4">
                Cineva <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-500">MVP</span>
            </h1>
            <p class="text-gray-400 text-sm md:text-base max-w-xl mb-8">
                รวมซีรี่ย์ หนัง การ์ตูน อนิเมะ ครบทุกแนว ดูได้ทุกที่ ทุกเวลา ไม่มีสะดุด
            </p>
        </div>

        <!-- Popular Series Section -->
        <div class="mt-4">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold text-white">ซีรี่ย์ยอดนิยม (คลิกเพื่อเลือกเรื่องรับชม)</h2>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-4">
                <!-- โปสเตอร์แต่ละเรื่อง กดแล้วส่งชื่อเรื่องไปหน้า watch.html -->
                <div onclick="selectSeries('ตื่นพลังเทพอัสนี')" class="bg-[#121824] border border-gray-800 rounded-2xl overflow-hidden group hover:border-indigo-500/50 transition cursor-pointer">
                    <div class="aspect-[3/4] bg-gray-900 flex items-center justify-center text-gray-600 text-xs">Poster 1</div>
                    <div class="p-3 text-center text-xs font-medium text-gray-200">ตื่นพลังเทพอัสนี</div>
                </div>
                <div onclick="selectSeries('The Last of Us')" class="bg-[#121824] border border-gray-800 rounded-2xl overflow-hidden group hover:border-indigo-500/50 transition cursor-pointer">
                    <div class="aspect-[3/4] bg-gray-900 flex items-center justify-center text-gray-600 text-xs">Poster 2</div>
                    <div class="p-3 text-center text-xs font-medium text-gray-200">The Last of Us</div>
                </div>
                <div onclick="selectSeries('รักนี้ไม่มีคำว่าม่')" class="bg-[#121824] border border-gray-800 rounded-2xl overflow-hidden group hover:border-indigo-500/50 transition cursor-pointer">
                    <div class="aspect-[3/4] bg-gray-900 flex items-center justify-center text-gray-600 text-xs">Poster 3</div>
                    <div class="p-3 text-center text-xs font-medium text-gray-200">รักนี้ไม่มีคำว่าม่</div>
                </div>
                <div onclick="selectSeries('One Piece')" class="bg-[#121824] border border-gray-800 rounded-2xl overflow-hidden group hover:border-indigo-500/50 transition cursor-pointer">
                    <div class="aspect-[3/4] bg-gray-900 flex items-center justify-center text-gray-600 text-xs">Poster 4</div>
                    <div class="p-3 text-center text-xs font-medium text-gray-200">One Piece</div>
                </div>
                <div onclick="selectSeries('จอมยุทธ์ถังฉิน')" class="bg-[#121824] border border-gray-800 rounded-2xl overflow-hidden group hover:border-indigo-500/50 transition cursor-pointer">
                    <div class="aspect-[3/4] bg-gray-900 flex items-center justify-center text-gray-600 text-xs">Poster 5</div>
                    <div class="p-3 text-center text-xs font-medium text-gray-200">จอมยุทธ์ถังฉิน</div>
                </div>
                <div onclick="selectSeries('Attack on Titan')" class="bg-[#121824] border border-gray-800 rounded-2xl overflow-hidden group hover:border-indigo-500/50 transition cursor-pointer">
                    <div class="aspect-[3/4] bg-gray-900 flex items-center justify-center text-gray-600 text-xs">Poster 6</div>
                    <div class="p-3 text-center text-xs font-medium text-gray-200">Attack on Titan</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function checkAuth() {
            try {
                const res = await fetch('/api/member/verify');
                const data = await res.json();
                if (!data.ok) {
                    window.location.href = '/';
                }
            } catch (err) {
                window.location.href = '/';
            }
        }

        function selectSeries(seriesName) {
            // ส่งชื่อซีรีส์ไปยังหน้าดูหนังผ่าน URL Parameter
            window.location.href = `/watch.html?series=${encodeURIComponent(seriesName)}`;
        }

        function searchSeries() {
            const query = document.getElementById('searchBox').value.trim();
            if (query) {
                selectSeries(query);
            }
        }

        async function handleLogout() {
            await fetch('/api/member/logout', { method: 'POST' });
            window.location.href = '/';
        }

        checkAuth();
    </script>
</body>
</html>

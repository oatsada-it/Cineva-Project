<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบสมาชิก VIP - Cineva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-[#121824] border border-gray-800 rounded-2xl p-8 shadow-2xl">
        <div class="text-center mb-8">
            <span class="text-indigo-500 text-3xl font-bold">▶</span>
            <h1 class="text-xl font-bold mt-2">กรอก Key VIP เพื่อเข้าชม</h1>
            <p class="text-gray-400 text-xs mt-1">ใส่รหัสผ่านที่ได้รับจากแอดมินเพื่อปลดล็อกระบบ</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-2">รหัส Key VIP</label>
                <input type="text" id="keyInput" required placeholder="VIP-XXX-XXX-XXX" class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl text-sm uppercase tracking-wider focus:outline-none focus:border-indigo-500 font-mono">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl text-sm transition">ยืนยันรหัสเข้าสู่ระบบ</button>
        </form>

        <div id="errorMsg" class="mt-4 text-center text-xs text-red-400 hidden"></div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const key = document.getElementById('keyInput').value.trim();
            const errDiv = document.getElementById('errorMsg');
            errDiv.classList.add('hidden');

            try {
                const res = await fetch('/api/member/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key })
                });
                const data = await res.json();
                if (data.ok) {
                    window.location.href = '/watch';
                } else {
                    errDiv.innerText = data.message || 'Key ไม่ถูกต้อง';
                    errDiv.classList.remove('hidden');
                }
            } catch (err) {
                errDiv.innerText = 'เกิดข้อผิดพลาดในการเชื่อมต่อ';
                errDiv.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
